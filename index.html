<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>香港 3 天 2 夜</title>
  <meta name="description" content="香港 3 天 2 夜行程（2027/01/22–01/24）">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="eyebrow" id="subtitle"></p>
      <h1 id="title"></h1>
      <p class="dates" id="dates"></p>
      <dl class="overview" id="overview"></dl>
    </div>
  </header>

  <nav class="tabs" aria-label="行程日">
    <div class="wrap" id="tabs" role="tablist"></div>
  </nav>

  <main class="wrap">
    <section id="days" aria-live="polite"></section>

    <section class="card">
      <h2>美食清單</h2>
      <p class="legend">
        <span class="badge mic">米芝蓮</span> 依《香港澳門米芝蓮指南》・
        <span class="badge bk-booked">已預約</span>
        <span class="badge bk-bookable">可預訂</span>
        
        <span class="badge bk-walkin">現場排隊</span>
      </p>
      <div class="table-wrap">
        <table id="food">
          <thead><tr><th>類別</th><th>店名</th><th>地區</th><th>米芝蓮</th><th>訂位</th><th>安排</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <h2>行前清單</h2>
        <ul class="checklist" id="checklist"></ul>
        <p class="hint">勾選狀態只存在你自己的瀏覽器。</p>
      </section>
      <section class="card">
        <h2>旅遊小提醒</h2>
        <dl class="tips" id="tips"></dl>
      </section>
    </div>

    <section class="card">
      <h2>實用連結</h2>
      <ul class="links" id="links"></ul>
    </section>
  </main>

  <footer class="wrap foot">資訊僅供參考，出發前請再次確認交通與景點最新資訊。</footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
